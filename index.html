    function showQuestion() {
      let available = questions.map((_, i) => i).filter(i => !answered.has(i));
      if (available.length === 0) { answered.clear(); available = questions.map((_, i) => i); }
      const idx = available[Math.floor(Math.random() * available.length)];
      const base = questions[idx];
      // 打亂選項順序，並重算正確答案索引
      const order = base.options.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
      }
      const shuffledOpts = order.map(i => base.options[i]);
      const newAnswer = order.indexOf(base.answer);
      let tag = base.tag || '';
      if (!tag) {
        const qq = base.q;
        if (qq.indexOf('MECE') >= 0) tag = '本週社課 · MECE';
        else if (qq.indexOf('費米') >= 0) tag = '本週社課 · 費米';
        else if (qq.indexOf('簡報') >= 0) tag = '本週社課 · 簡報';
        else if (qq.indexOf('競品') >= 0) tag = '本週社課 · 競品分析';
        else if (qq.indexOf('產業') >= 0 || qq.indexOf('波特') >= 0) tag = '本週社課 · 產業分析';
        else if (qq.indexOf('Prime') >= 0 || qq.indexOf('一頁') >= 0) tag = '本週社課 · Prime';
        else if (qq.indexOf('假設') >= 0 || qq.indexOf('個案') >= 0 || qq.indexOf('洞察') >= 0) tag = '本週社課 · 分析思維';
        else tag = '本週社課相關';
      }
      currentQ = { q: base.q, options: shuffledOpts, answer: newAnswer, explain: base.explain, idx, tag };

      document.getElementById('q-text').innerHTML = (currentQ.tag ? '<span style="color:#ffd780;font-size:12px;">' + currentQ.tag + '</span><br>' : '') + currentQ.q;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      document.getElementById('result-msg').textContent = '';
      document.getElementById('close-btn').style.display = 'none';
      showingResult = false;
      currentQ.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = (i+1) + '. ' + opt;
        btn.onclick = () => selectAnswer(i);
        optionsDiv.appendChild(btn);
      });
      document.getElementById('question-modal').classList.add('show');
    }

    function selectAnswer(selected) {
      if (showingResult) return;
      showingResult = true;
      document.querySelectorAll('.option-btn').forEach((b, i) => {
        b.disabled = true;
        if (i === currentQ.answer) b.classList.add('correct');
        else if (i === selected) b.classList.add('wrong');
      });
      const msg = document.getElementById('result-msg');
      const tagLine = currentQ.tag ? ('【' + currentQ.tag + '】') : '';
      stats.quizAnswered = (stats.quizAnswered || 0) + 1;
      if (currentQ.tag) {
        stats.quizTags = stats.quizTags || {};
        stats.quizTags[currentQ.tag] = true;
      }
      if (selected === currentQ.answer) {
        quizStreak = (quizStreak || 0) + 1;
        updateStreakUI();
        let bonus = 2 + (quizStreak >= 3 ? 2 : 0); // 連對3題再+2
        fishCaught += bonus;
        document.getElementById('score-box').textContent = '魚獲 ' + fishCaught;
        let streakTxt = quizStreak >= 2 ? (' 連對×' + quizStreak) : '';
        if (quizStreak >= 3) streakTxt += ' 加成!';
        msg.textContent = '✅ 答對了！+' + bonus + ' 魚獲' + streakTxt + '  ' + tagLine + (currentQ.explain || '');
        msg.style.color = '#7fff7f';
        answered.add(currentQ.idx);
        stats.quizCorrect = (stats.quizCorrect || 0) + 1;
        ensureMissionDay();
        missionState.quizOk++;
        saveMission();
        updateMissionUI();
        saveGameSave();
        AudioSys.correct();
      } else {
        quizStreak = 0;
        updateStreakUI();
        msg.textContent = '❌ 答錯了～ 不扣分  ' + tagLine + (currentQ.explain || '');
        msg.style.color = '#ff9f9f';
        stats.quizWrong = (stats.quizWrong || 0) + 1;
        AudioSys.wrong();
      }
      saveStats();
      checkAchievements();
      document.getElementById('close-btn').style.display = 'inline-block';
    }

      if (ent.isNessie || ent.isRuby || ent.isHuge) return { key: 'legend', label: '傳說', cls: 'r-legend' };
      if (ent.kind === '大魚' || ent.kind === '大龜') return { key: 'rare', label: '稀有', cls: 'r-rare' };
      if (ent.isTrash) return { key: 'common', label: '普通', cls: 'r-common' };
      return { key: 'common', label: '普通', cls: 'r-common' };
    }

    function pointerToGame(e) {
      const rect = canvas.getBoundingClientRect();
      const src = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]) || e;
      // 螢幕像素 → canvas 內部像素
      const sx = (src.clientX - rect.left) * (W / Math.max(1, rect.width));
      const sy = (src.clientY - rect.top) * (H / Math.max(1, rect.height));
      // 還原邏輯座標（含 view 偏移與縮放）
      return {
        x: (sx - viewOX) / scale,
        y: (sy - viewOY) / scale
      };
    }

    let lastPointerTs = 0;
    function onPointer(e) {
      try {
        e.preventDefault();
        // 避免 touch + click 連點兩次
        const now = Date.now();
        if (now - lastPointerTs < 280) return;
        lastPointerTs = now;

        if (!gameStarted) return;
        if (tryEscapeSave()) return;

        // 點肩上鸚鵡（小範圍，失敗不擋拋竿）
        if (state === 'idle' && parrot && parrot.mode === 'perch') {
          const p = pointerToGame(e);
          if (Math.abs(p.x - parrot.x) < 16 && Math.abs(p.y - parrot.y) < 14) {
            parrot.wing += 2;
            const sy = parrot.y;
            parrot.y = sy - 3;
            setTimeout(() => { if (parrot.mode === 'perch') parrot.y = sy; }, 200);
            setStatus('鸚鵡：咕咕！');
            stats.parrotPet = true; saveStats(); checkAchievements();
            try { if (navigator.vibrate) navigator.vibrate(20); } catch (err) {}
            return;
          }
        }

        // 有動靜：收竿
        if (state === 'waiting' && biteReady) {
          biteReady = false;
          const wb = document.getElementById('wait-bar-wrap');
          if (wb) wb.classList.remove('show');
          startPull();
          return;
        }

        // 等待中提前點：nearFish 可收，否則空竿
        if (state === 'waiting' && !biteReady) {
          if (nearFish) {
            biteReady = false;
            const wb = document.getElementById('wait-bar-wrap');

            modal.classList.add('show');
            setStatus('空竿');
          }
          return;
        }

        if (state === 'idle') startCast();
      } catch (err) {
        console.error(err);

      }
    }

    function loop(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;
      dayTime = (dayTime + daySpeed * dt) % 1;
      document.getElementById('time-box').textContent = getTimeLabel(dayTime);
      if (getTimeLabel(dayTime) === '深夜' || getTimeLabel(dayTime) === '夜晚') {
        if (!stats.sawNight) { stats.sawNight = true; saveStats(); checkAchievements(); }
      }
      cloudOffset += dt * (weather === 'storm' ? 0.035 : weather === 'rain' ? 0.02 : 0.01);
      wavePhase += dt * (weather === 'storm' ? 0.006 : 0.0035);
      birdPhase += dt * 0.002;
      heartPhase += dt * 0.004;
      updateParrot(dt);

      // --- weather system (small chance) ---
      weatherTimer -= dt;
      weatherCooldown -= dt;
      if (lightningFlash > 0) lightningFlash = Math.max(0, lightningFlash - dt * 0.004);
      if (weather === 'clear' && weatherCooldown <= 0) {
        const r = Math.random();
        // ~3% storm, ~8% rain, ~4% fog
        if (r < 0.03) {
          weather = 'storm';
          weatherTimer = 18000 + Math.random() * 22000;
          rainDrops = [];
          setStatus('雷暴來襲！');
          AudioSys.startRain(true);
          stats.sawStorm = true; saveStats(); checkAchievements();
        } else if (r < 0.11) {
          weather = 'rain';
          weatherTimer = 20000 + Math.random() * 25000;
          rainDrops = [];
          setStatus('下雨了…');
          AudioSys.startRain(false);
          stats.sawRain = true; saveStats(); checkAchievements();
        } else if (r < 0.15) {
          weather = 'fog';
          weatherTimer = 16000 + Math.random() * 20000;
          setStatus('起霧了…');
          stats.sawFog = true; saveStats(); checkAchievements();
        }
        weatherCooldown = 50000 + Math.random() * 70000;
      } else if (weather !== 'clear' && weatherTimer <= 0) {
        weather = 'clear';
        rainDrops = [];
        lightningFlash = 0;
        AudioSys.stopRain();
        setStatus(state === 'idle' ? '準備中' : document.getElementById('status-box').textContent);
      }
      // update rain positions
      if (weather !== 'clear') {
        rainDrops.forEach(d => {
          d.y += d.spd;
          d.x += d.drift * 0.4;
          if (d.y > IH + 10) {
            d.y = -10;
            d.x = Math.random() * (IW + 40) - 20;
          }
        });
        if (weather === 'storm' && Math.random() < 0.008) {
          lightningFlash = 1;
          screenShake = Math.max(screenShake, 0.35);
          AudioSys.thunder();
          try { if (navigator.vibrate) navigator.vibrate([30, 40, 20]); } catch (e) {}
        }
      }

      if (state === 'casting') {
        castProgress += dt / 900;
        if (castProgress >= 1) { castProgress = 1; beginWaiting(); }
      }
      // 效能：連續慢幀時降載
      if (dt > 50) perfScale = Math.max(0.5, perfScale - 0.05);
      else if (dt < 22) perfScale = Math.min(1, perfScale + 0.02);

      if (state === 'waiting') {
        waitElapsed += dt;
        bobberPhase += dt * 0.007;
        // 進度條與狀態文字
        const pct = Math.min(100, (waitElapsed / waitTime) * 100);
        const bar = document.getElementById('wait-bar');
        if (bar) bar.style.width = pct + '%';
        const remain = Math.max(0, Math.ceil((waitTime - waitElapsed) / 1000));
        if (waitElapsed > waitTime - nearWindow) {
          nearFish = true;
          if (Math.random() < 0.1) {
            bubbles.push({ x: 240+Math.random()*20, y: 175+Math.random()*10, s: 2+Math.random()*2, life: 0, vy: -0.3-Math.random()*0.25 });
          }
          if (Math.random() < 0.02) AudioSys.waterLap();
        }
        bubbles.forEach(b => { b.y += b.vy; b.life += dt*0.0015; });
        bubbles = bubbles.filter(b => b.life < 1);

        // 時間到：進入「有動靜／可收竿」由玩家決定
        if (!biteReady && waitElapsed >= waitTime) {
          biteReady = true;
          biteTimer = pendingBiteMs || 5000;
          nearFish = true;
          setStatus('有動靜！點擊收竿');
          if (bar) { bar.style.width = '100%'; bar.classList.add('ready'); }
          try { if (navigator.vibrate) navigator.vibrate(40); } catch (e) {}
        }
        if (biteReady) {
          biteTimer -= dt;
          const sec = Math.max(0, Math.ceil(biteTimer / 1000));
          setStatus('有動靜！點擊收竿 ' + sec);
          if (bar) {
            bar.classList.add('ready');
            bar.style.width = Math.max(0, (biteTimer / (pendingBiteMs || 5000)) * 100) + '%';
          }
          if (biteTimer <= 0) {
            // 沒收竿 → 脫鉤／跑掉
            biteReady = false;
            currentLoot = pendingLoot || rollLoot();
            pendingLoot = null;
            const wb = document.getElementById('wait-bar-wrap');
            if (wb) wb.classList.remove('show');
            showEscapeResult();
          }
        } else if (nearFish) {
          setStatus('有動靜…再等等');
        } else {
          setStatus('等待中 ' + remain + '秒');
        }
      }
      if (state === 'pulling') {
        const dur = Math.max(400, pullDurationMs || 1100);
        pullProgress += dt / dur;
        pullFxTimer += dt;
        const isLeg = currentLoot && (currentLoot.type === 'nessie' || currentLoot.type === 'ruby');
        const isHugeF = currentLoot && currentLoot.type === 'huge';
        if (pullStruggle > 0) {
          // 掙扎強度隨進度起伏（中段最猛）
          const wave = Math.sin(pullProgress * Math.PI);
          screenShake = (isLeg ? 0.75 : 0.5) + (isLeg ? 0.55 : 0.4) * wave + 0.15 * Math.sin(now * 0.03);
          // 狀態文字階段
          if (isLeg) {
            const secLeft = Math.max(1, Math.ceil((1 - pullProgress) * dur / 1000));
            if (pullProgress < 0.3) setStatus((currentLoot.type === 'nessie' ? '??? 猛然下潛！！ ' : '紅寶石眩光中… ') + secLeft + 's');
            else if (pullProgress < 0.65) setStatus((currentLoot.type === 'nessie' ? '線快斷了！拉住！！ ' : '強光拉扯中！！ ') + secLeft + 's');
            else setStatus((currentLoot.type === 'nessie' ? '最後一搏…！！ ' : '就要上岸了！！ ') + secLeft + 's');
          } else if (isHugeF) {
            const secLeft = Math.max(1, Math.ceil((1 - pullProgress) * dur / 1000));
            setStatus('超大魚拉扯中！！ ' + secLeft + 's');
          }
          // 音效／震動節奏
          const sfxRate = isLeg ? 0.07 : 0.04;
          if (Math.random() < sfxRate) AudioSys.reel();
          if (Math.random() < (isLeg ? 0.04 : 0.02)) AudioSys.splash(true);
          if (Math.random() < (isLeg ? 0.05 : 0.025)) {
            try { if (navigator.vibrate) navigator.vibrate(isLeg ? [30, 20, 40] : 25); } catch (e) {}
          }
          // 週期性大抖
          if (isLeg && pullFxTimer > 900) {
            pullFxTimer = 0;
            screenShake = 1.4;
            AudioSys.splash(true);
            try { if (navigator.vibrate) navigator.vibrate([40, 30, 60]); } catch (e) {}
          }
        } else if (screenShake > 0) {
          screenShake *= 0.9;
        }
        if (pullProgress >= 1) { pullProgress = 1; screenShake = isLeg ? 1.0 : 0.8; finishPull(); }
      } else if (screenShake > 0) {
        screenShake *= 0.85;
        if (screenShake < 0.02) screenShake = 0;
      }
      draw(now);
      requestAnimationFrame(loop);
    }
  </script>
</body>
</html>
