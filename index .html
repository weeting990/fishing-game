<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>商研社 · 像素釣魚挑戰</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #7eb8d4;
      margin: 0; padding: 0;
      font-family: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
      touch-action: manipulation;
    }
    #gameCanvas {
      display: block; width: 100%; height: 100%;
      background: #7eb8d4;
      image-rendering: pixelated;
      cursor: crosshair;
      touch-action: none;
    }
    #ui-layer {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; display: flex; flex-direction: column;
      justify-content: space-between; padding: 10px;
    }
    .pixel-box {
      background: rgba(30, 50, 70, 0.88);
      border: 3px solid #e8d9b5;
      box-shadow: 0 0 0 2px #1a1208;
      color: #f0e6d0; padding: 8px 12px; font-size: 13px; line-height: 1.4;
      pointer-events: auto; border-radius: 2px;
    }
    #top-bar { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    #instruction {
      text-align: center; max-width: 340px; margin: 0 auto 10px;
      font-size: 13px; display: none;
    }
    #collection-btn { display: none; }
    #bottom-controls {
      align-self: flex-end;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: auto;
    }
    #mute-btn { display: none; }
    #question-modal, #result-modal, #collection-modal, #achievement-modal {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 20, 40, 0.88); justify-content: center; align-items: center;
      pointer-events: auto; z-index: 100;
    }
    #question-modal.show, #result-modal.show, #collection-modal.show, #achievement-modal.show { display: flex; }
    .modal-content, .collection-panel {
      background: #1a3048; border: 5px solid #e8d9b5;
      box-shadow: 0 0 0 3px #1a1208, 6px 6px 0 #0a1020;
      max-width: 92%; width: 400px; padding: 18px; color: #f0e6d0; text-align: center;
    }
    .collection-panel {
      max-height: 80vh; display: flex; flex-direction: column; width: 420px;
    }
    .modal-content h2, .collection-panel h2 { font-size: 16px; margin-bottom: 10px; color: #ffd700; }
    .modal-content .q-text { font-size: 14px; margin-bottom: 14px; line-height: 1.55; }
    .option-btn {
      display: block; width: 100%; margin: 7px 0; padding: 12px 10px;
      background: #2a4a68; border: 3px solid #e8d9b5; color: #f0e6d0;
      font-family: inherit; font-size: 13px; cursor: pointer; text-align: left;
    }
    .option-btn:active { background: #3a6a88; }
    .option-btn.correct { background: #1f5a2f; border-color: #7fff7f; }
    .option-btn.wrong { background: #5a2020; border-color: #ff7f7f; }
    .result-msg { margin-top: 10px; font-size: 13px; min-height: 22px; }
    .close-btn, .ok-btn, .col-close {
      margin-top: 14px; padding: 11px 24px; background: #7a4a1f;
      border: 3px solid #e8d9b5; color: #f0e6d0; font-family: inherit;
      font-size: 14px; cursor: pointer;
    }
    .collection-stats { font-size: 12px; margin-bottom: 10px; opacity: 0.9; }
    .collection-list {
      overflow-y: auto; flex: 1; text-align: left;
      border: 2px solid #3a5a7a; background: #0a1828; padding: 6px; max-height: 50vh;
    }
    .col-item {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 6px; border-bottom: 1px solid #2a3a4a; font-size: 13px;
    }
    .col-item.locked { opacity: 0.45; }
    .col-item .col-icon {
      width: 52px; height: 36px; flex-shrink: 0;
      background: #0a2030; border: 1px solid #4a5a6a;
      image-rendering: pixelated;
    }
    .col-item .col-name { flex: 1; }
    .col-item .col-tag {
      font-size: 10px; padding: 2px 6px; background: #2a4a3a; color: #a0e0a0;
    }
    .col-item.locked .col-tag { background: #3a3a3a; color: #888; }
    #loot-preview {
      width: 80px; height: 60px; margin: 8px auto;
      image-rendering: pixelated; background: #0a2030; border: 2px solid #e8d9b5;
    }
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #7eb8d4 0%, #4a8ab0 100%);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 200; pointer-events: auto; text-align: center; padding: 16px;
    }
    #start-screen h1 { font-size: 26px; color: #fff8e0; text-shadow: 3px 3px 0 #2a4a6a; margin-bottom: 6px; }
    #start-screen .sub { font-size: 13px; color: #d0e8f8; margin-bottom: 20px; }
    #start-btn {
      padding: 14px 36px; background: #3a8a5a; border: 4px solid #e8d9b5;
      color: #fff; font-family: inherit; font-size: 16px; cursor: pointer;
      box-shadow: 4px 4px 0 #1a3a2a;
    }
    #start-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 #1a3a2a; }
    #start-screen .hint { margin-top: 18px; font-size: 12px; color: #c0d8e8; max-width: 340px; line-height: 1.6; }
    #tutorial-toast {
      position: absolute; left: 50%; top: 18%; transform: translateX(-50%);
      background: rgba(20,40,60,0.92); border: 3px solid #e8d9b5; color: #f0e6d0;
      padding: 12px 16px; font-size: 14px; line-height: 1.7; text-align: center;
      pointer-events: none; z-index: 40; border-radius: 4px; max-width: 90%;
      transition: opacity 0.5s; display: none;
    }
    #tutorial-toast .step { opacity: 0.95; }
    #tutorial-toast .num { color: #ffd780; font-weight: bold; }
    .col-tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
    .col-tab {
      font-size: 11px; padding: 4px 8px; background: #2a4a68; border: 2px solid #e8d9b5;
      color: #d0e0f0; cursor: pointer; font-family: inherit;
    }
    .col-tab.active { background: #3a7a50; border-color: #a0e0a0; color: #fff; }
    .col-progress {
      height: 10px; background: #0a1828; border: 2px solid #3a5a7a; margin: 6px 0 10px;
      overflow: hidden;
    }
    .col-progress > div { height: 100%; background: linear-gradient(90deg,#3a8a5a,#7fff7f); width: 0%; }
    .col-rarity { font-size: 9px; padding: 1px 5px; margin-left: 4px; border-radius: 2px; }
    .r-common { background: #3a5a4a; color: #a0d0a0; }
    .r-rare { background: #2a4a7a; color: #8ab0ff; }
    .r-legend { background: #6a3a1a; color: #ffd780; }
    #share-box {
      margin-top: 10px; font-size: 12px; color: #c0d8e8; line-height: 1.5;
      background: #0a1828; border: 1px dashed #4a6a8a; padding: 8px; display: none;
    }
    #newcatch-flash {
      position: absolute; left: 50%; top: 40%; transform: translate(-50%,-50%);
      color: #ffe080; font-size: 18px; font-weight: bold; text-shadow: 2px 2px 0 #1a1208;
      pointer-events: none; z-index: 45; opacity: 0; transition: opacity 0.3s;
      text-align: center;
    }
    #load-hint {
      position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #d0e8f8; opacity: 0.8; pointer-events: none;
    }
    #achievement-modal { z-index: 52; }
    .ach-item {
      display: flex; gap: 8px; align-items: flex-start; padding: 8px;
      border-bottom: 1px solid #2a4a6a; text-align: left;
    }
    .ach-item.locked { opacity: 0.4; }
    .ach-icon {
      width: 36px; height: 36px; flex-shrink: 0;
      image-rendering: pixelated; background: #0a2030;
      border: 2px solid #e8d9b5; box-sizing: border-box;
    }
    .ach-item.locked .ach-icon { border-color: #3a4a5a; opacity: 0.85; }
    .ach-title { font-size: 13px; color: #ffd780; }
    .ach-desc { font-size: 11px; color: #b0c8d8; margin-top: 2px; }
    #ach-toast {
      position: absolute; top: 14%; left: 50%; transform: translateX(-50%);
      background: rgba(30,50,20,0.95); border: 3px solid #c0e080; color: #f0ffe0;
      padding: 10px 16px; z-index: 60; display: none; text-align: center;
      font-size: 13px; max-width: 88%; border-radius: 4px;
    }
  </style>
</head>
<body>
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-layer">
    <div id="top-bar">
      <div id="score-box" class="pixel-box">魚獲 0</div>
      <div id="status-box" class="pixel-box">準備中</div>
      <div id="time-box" class="pixel-box">白天</div>
    </div>
    <div id="instruction" class="pixel-box" style="display:none;"></div>
    <div id="bottom-controls">
      <button id="collection-btn" class="pixel-box">魚庫</button>
      <button id="ach-btn" class="pixel-box" style="display:none;">成就</button>
      <button id="mute-btn" class="pixel-box">音樂 開</button>
      <button id="reset-btn" class="pixel-box" style="display:none;font-size:11px;">清除存檔</button>
    </div>
  </div>
  <div id="tutorial-toast">
    <div class="step"><span class="num">1</span> 點一下拋竿</div>
    <div class="step"><span class="num">2</span> 等水面水花</div>
    <div class="step"><span class="num">3</span> 自動收線上鉤</div>
  </div>
  <div id="newcatch-flash">✨ 新圖鑑！</div>

  <div id="result-modal">
    <div class="modal-content">
      <h2 id="result-title">釣到了！</h2>
      <canvas id="loot-preview" width="80" height="60"></canvas>
      <div class="q-text" id="loot-desc"></div>
      <button class="ok-btn" id="ok-btn">繼續釣魚</button>
    </div>
  </div>

  <div id="question-modal">
    <div class="modal-content">
      <h2>釣到問題魚！</h2>
      <div class="q-text" id="q-text"></div>
      <div id="options"></div>
      <div class="result-msg" id="result-msg"></div>
      <button class="close-btn" id="close-btn" style="display:none;">繼續釣魚</button>
    </div>
  </div>

  <div id="ach-toast"></div>
  <div id="achievement-modal">
    <div class="collection-panel">
      <h2>成就列表</h2>
      <div class="collection-stats" id="ach-stats">0 / 36</div>
      <div class="collection-list" id="ach-list"></div>
      <button class="col-close" id="ach-close-btn">關閉</button>
    </div>
  </div>
  <div id="collection-modal">
    <div class="collection-panel">
      <h2>魚庫圖鑑</h2>
      <div class="collection-stats" id="collection-stats">已發現 0 / 0</div>
      <div class="col-progress"><div id="col-progress-bar"></div></div>
      <div class="col-tabs" id="col-tabs">
        <button class="col-tab active" data-filter="all">全部</button>
        <button class="col-tab" data-filter="trash">垃圾</button>
        <button class="col-tab" data-filter="small">小魚</button>
        <button class="col-tab" data-filter="big">大魚</button>
        <button class="col-tab" data-filter="huge">超大型</button>
        <button class="col-tab" data-filter="legend">傳說</button>
      </div>
      <div class="collection-list" id="collection-list"></div>
      <div id="share-box"></div>
      <button class="col-close" id="col-close-btn">關閉</button>
    </div>
  </div>

  <div id="start-screen">
    <h1>商研社</h1>
    <div class="sub">COZY PIXEL FISHING</div>
    <button id="start-btn">開始釣魚挑戰</button>
    <div class="hint">點一下拋竿 → 等水花 → 自動收線<br>圖鑑收集 · 商研社課題 · 存檔保留</div>
    <div id="load-hint">載入完成 · 點開始即可</div>
  </div>

    // ========== Minecraft-like fishing audio (Web Audio, no external files) ==========
    const AudioSys = {
      ctx: null,
      bgmNodes: null,
      bgmOn: true,
      sfxOn: true,
      master: null,
      ensure() {
        if (this.ctx) return;
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        this.ctx = new AC();
        this.master = this.ctx.createGain();
        this.master.gain.value = 0.85;
        this.master.connect(this.ctx.destination);
      },
      resume() {
        this.ensure();
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      },
      // soft noise buffer
      noiseBuf(sec) {
        const sr = this.ctx.sampleRate;
        const n = Math.floor(sr * sec);
        const buf = this.ctx.createBuffer(1, n, sr);
        const d = buf.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
        return buf;
      },
      // cast whoosh (Minecraft-like rod swing)
      cast() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf(0.35);
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(800, t);
        bp.frequency.exponentialRampToValueAtTime(200, t + 0.3);
        bp.Q.value = 0.8;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.75, t + 0.04);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
        src.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + 0.35);
        // soft tone
        const o = this.ctx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
        const og = this.ctx.createGain();
        og.gain.setValueAtTime(0.16, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        o.connect(og); og.connect(this.master);
        o.start(t); o.stop(t + 0.26);
      },
      // bobber splash / plop
      splash(big) {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf(big ? 0.5 : 0.28);
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass';
        lp.frequency.setValueAtTime(big ? 900 : 1400, t);
        lp.frequency.exponentialRampToValueAtTime(180, t + (big ? 0.4 : 0.22));
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(big ? 0.9 : 0.55, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (big ? 0.45 : 0.25));
        src.connect(lp); lp.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + (big ? 0.5 : 0.28));
        // bubble-ish blip
        const o = this.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(big ? 140 : 280, t);
        o.frequency.exponentialRampToValueAtTime(60, t + 0.15);
        const og = this.ctx.createGain();
        og.gain.setValueAtTime(0.22, t);
        og.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        o.connect(og); og.connect(this.master);
        o.start(t); o.stop(t + 0.2);
      },
      // subtle water lap while waiting (occasional)
      waterLap() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf(0.2);
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'lowpass'; bp.frequency.value = 600;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.08, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
        src.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + 0.2);
      },
      // reel / catch tug
      reel() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        for (let i = 0; i < 5; i++) {
          const o = this.ctx.createOscillator();
          o.type = 'square';
          o.frequency.value = 180 + i * 40 + Math.random() * 30;
          const g = this.ctx.createGain();
          const st = t + i * 0.05;
          g.gain.setValueAtTime(0.0001, st);
          g.gain.exponentialRampToValueAtTime(0.14, st + 0.01);
          g.gain.exponentialRampToValueAtTime(0.0001, st + 0.05);
          o.connect(g); g.connect(this.master);
          o.start(st); o.stop(st + 0.06);
        }
      },
      // catch success (Minecraft XP-ish sparkle)
      catchOK(huge) {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        this.splash(!!huge);
        const t = this.ctx.currentTime + 0.08;
        const notes = huge ? [523, 659, 784, 1046] : [392, 523, 659];
        notes.forEach((f, i) => {
          const o = this.ctx.createOscillator();
          o.type = 'triangle';
          o.frequency.value = f;
          const g = this.ctx.createGain();
          const st = t + i * 0.07;
          g.gain.setValueAtTime(0.0001, st);
          g.gain.exponentialRampToValueAtTime(0.22, st + 0.02);
          g.gain.exponentialRampToValueAtTime(0.0001, st + 0.25);
          o.connect(g); g.connect(this.master);
          o.start(st); o.stop(st + 0.28);
        });
      },

      trash() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        this.splash(false);
        const t = this.ctx.currentTime + 0.05;
        const o = this.ctx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(160, t);
        o.frequency.exponentialRampToValueAtTime(70, t + 0.2);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.08, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.22);
        o.connect(g); g.connect(this.master);
        o.start(t); o.stop(t + 0.23);
      },
      // answer correct / wrong
      correct() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        [523, 659, 784].forEach((f, i) => {
          const o = this.ctx.createOscillator(); o.type = 'sine'; o.frequency.value = f;
          const g = this.ctx.createGain();
          const st = t + i * 0.08;
          g.gain.setValueAtTime(0.1, st); g.gain.exponentialRampToValueAtTime(0.001, st + 0.2);
          o.connect(g); g.connect(this.master); o.start(st); o.stop(st + 0.22);
        });
      },
      wrong() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        const o = this.ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.setValueAtTime(200, t); o.frequency.exponentialRampToValueAtTime(90, t + 0.25);
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.1, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
        o.connect(g); g.connect(this.master); o.start(t); o.stop(t + 0.3);
      },
      // thunder clap (noise + low rumble)
      thunder() {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        const t = this.ctx.currentTime;
        // crack: band-passed noise burst
        const src = this.ctx.createBufferSource();
        src.buffer = this.noiseBuf(0.9);
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.setValueAtTime(600, t);
        bp.frequency.exponentialRampToValueAtTime(120, t + 0.5);
        bp.Q.value = 0.6;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.85, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.25, t + 0.2);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
        src.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(t); src.stop(t + 0.9);
        // low rumble
        const o = this.ctx.createOscillator();
        o.type = 'sine';
        o.frequency.setValueAtTime(55, t);
        o.frequency.exponentialRampToValueAtTime(28, t + 1.2);
        const og = this.ctx.createGain();
        og.gain.setValueAtTime(0.0001, t);
        og.gain.exponentialRampToValueAtTime(0.45, t + 0.05);
        og.gain.exponentialRampToValueAtTime(0.0001, t + 1.3);
        o.connect(og); og.connect(this.master);
        o.start(t); o.stop(t + 1.35);
        // second delayed crack (echo)
        const src2 = this.ctx.createBufferSource();
        src2.buffer = this.noiseBuf(0.5);
        const lp = this.ctx.createBiquadFilter();
        lp.type = 'lowpass'; lp.frequency.value = 400;
        const g2 = this.ctx.createGain();
        const t2 = t + 0.28;
        g2.gain.setValueAtTime(0.0001, t2);
        g2.gain.exponentialRampToValueAtTime(0.35, t2 + 0.03);
        g2.gain.exponentialRampToValueAtTime(0.0001, t2 + 0.45);
        src2.connect(lp); lp.connect(g2); g2.connect(this.master);
        src2.start(t2); src2.stop(t2 + 0.5);
      },
      rainNodes: null,
      startRain(heavy) {
        if (!this.sfxOn) return;
        this.resume();
        if (!this.ctx) return;
        this.stopRain();
        const t = this.ctx.currentTime;
        // looping filtered noise as rain
        const buf = this.noiseBuf(2.0);
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const bp = this.ctx.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = heavy ? 1200 : 900;
        bp.Q.value = 0.5;
        const hp = this.ctx.createBiquadFilter();
        hp.type = 'highpass';
        hp.frequency.value = 400;
        const g = this.ctx.createGain();
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(heavy ? 0.28 : 0.16, t + 1.2);
        src.connect(hp); hp.connect(bp); bp.connect(g); g.connect(this.master);
        src.start(t);
        this.rainNodes = { src, g, heavy: !!heavy };
      },
      setRainIntensity(heavy) {
        if (!this.rainNodes || !this.ctx) return;
        const t = this.ctx.currentTime;
        this.rainNodes.g.gain.linearRampToValueAtTime(heavy ? 0.28 : 0.16, t + 0.4);
        this.rainNodes.heavy = !!heavy;
      },
      stopRain() {
        if (!this.rainNodes) return;
        try {
          const t = this.ctx ? this.ctx.currentTime : 0;
          this.rainNodes.g.gain.linearRampToValueAtTime(0.0001, t + 0.8);
          const src = this.rainNodes.src;
          setTimeout(() => { try { src.stop(); } catch(e) {} }, 900);
        } catch (e) {}
        this.rainNodes = null;
      },
      // peaceful Minecraft-ish loop (soft arpeggio + pad)
      startBgm() {
        if (!this.bgmOn) return;
        this.resume();
        if (!this.ctx || this.bgmNodes) return;
        const t0 = this.ctx.currentTime;
        const bgmGain = this.ctx.createGain();
        bgmGain.gain.value = 0.16;
        bgmGain.connect(this.master);
        // gentle pad
        const pad = this.ctx.createOscillator();
        pad.type = 'sine';
        pad.frequency.value = 110;
        const padG = this.ctx.createGain();
        padG.gain.value = 0.35;
        pad.connect(padG); padG.connect(bgmGain);
        pad.start(t0);
        // arpeggio notes (C major peaceful)
        const seq = [262, 330, 392, 523, 392, 330, 294, 247];
        const oscs = [];
        const interval = 0.55;
        // schedule repeating with ScriptProcessor-like using recursive timeouts is fragile;
        // use looping buffer of soft tones instead
        const sr = this.ctx.sampleRate;
        const loopSec = seq.length * interval;
        const buf = this.ctx.createBuffer(1, Math.floor(sr * loopSec), sr);
        const data = buf.getChannelData(0);
        for (let i = 0; i < data.length; i++) {
          const time = i / sr;
          const idx = Math.floor(time / interval) % seq.length;
          const local = time - idx * interval;
          const freq = seq[idx];
          const env = Math.exp(-local * 3.5) * (local < 0.02 ? local / 0.02 : 1);
          // soft triangle-ish
          const phase = 2 * Math.PI * freq * time;
          const tri = 2 * Math.abs(2 * ((freq * time) % 1) - 1) - 1;
          data[i] = tri * env * 0.22 + Math.sin(2 * Math.PI * 110 * time) * 0.04;
        }
        const src = this.ctx.createBufferSource();
        src.buffer = buf;
        src.loop = true;
        const filt = this.ctx.createBiquadFilter();
        filt.type = 'lowpass'; filt.frequency.value = 1800;
        src.connect(filt); filt.connect(bgmGain);
        src.start(t0);
        this.bgmNodes = { pad, src, bgmGain };
      },
      stopBgm() {
        if (!this.bgmNodes) return;
        try { this.bgmNodes.pad.stop(); } catch(e) {}
        try { this.bgmNodes.src.stop(); } catch(e) {}
        this.bgmNodes = null;
      },
      toggleBgm() {
        this.bgmOn = !this.bgmOn;
        if (this.bgmOn) this.startBgm(); else this.stopBgm();
        return this.bgmOn;
      }
    };

    function getItemKey(loot) {
      if (loot.type === 'trash') return 'trash_' + loot.data.name;
      if (loot.type === 'nessie') return 'nessie';
      if (loot.type === 'ruby') return 'ruby';
      return 'fish_' + loot.data.name;
    }
    function markCollected(loot) {
      const key = getItemKey(loot);
      let isNew = false;
      if (!collection[key]) {
        collection[key] = { count: 1, firstAt: Date.now() };
        isNew = true;
        stats.newUnlocks = (stats.newUnlocks || 0) + 1;
      } else {
        collection[key].count = (collection[key].count || 1) + 1;
      }
      if (loot.type === 'trash') { stats.trash++; stats.gotTrash = true; }
      else if (loot.type === 'small') stats.small++;
      else if (loot.type === 'big') stats.big++;
      else if (loot.type === 'huge') stats.huge++;
      else if (loot.type === 'nessie' || loot.type === 'ruby') stats.gotLegend = true;
      saveStats();
      saveCollection();
      checkAchievements();
      return isNew;
    }

    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W; canvas.height = H;
      // 直向手機：以寬度填滿，減少上下大片空白
      if (H > W) scale = W / IW;
      else scale = Math.min(W / IW, H / IH);
    }
    window.addEventListener('resize', resize);
    resize();

    function lerp(a, b, t) { return a + (b - a) * Math.max(0, Math.min(1, t)); }
    function lerpColor(c1, c2, t) {
      const p = s => {
        if (s.startsWith('#')) { const h = parseInt(s.slice(1), 16); return [(h>>16)&255,(h>>8)&255,h&255]; }
        const m = s.match(/\d+/g); return m ? [+m[0],+m[1],+m[2]] : [0,0,0];
      };
      const A = p(c1), B = p(c2);
      return `rgb(${Math.round(lerp(A[0],B[0],t))},${Math.round(lerp(A[1],B[1],t))},${Math.round(lerp(A[2],B[2],t))})`;
    }
    function getSky(t) {
      if (t < 0.18) return lerpColor('#1a2a40', '#ffb080', t/0.18);
      if (t < 0.28) return lerpColor('#ffb080', '#a8d4e8', (t-0.18)/0.1);
      if (t < 0.72) return '#a8d4e8';
      if (t < 0.82) return lerpColor('#a8d4e8', '#ff8a60', (t-0.72)/0.1);
      if (t < 0.92) return lerpColor('#ff8a60', '#1a2a40', (t-0.82)/0.1);
      return '#1a2a40';
    }
    function getWater(t) {
      if (t < 0.22 || t > 0.85) return '#2a4a60';
      if (t < 0.32) return lerpColor('#2a4a60', '#6a9ab8', (t-0.22)/0.1);
      if (t > 0.75) return lerpColor('#6a9ab8', '#2a4a60', (t-0.75)/0.1);
      return '#6a9ab8';
    }
    function getTimeLabel(t) {
      if (t < 0.18) return '深夜'; if (t < 0.28) return '黎明'; if (t < 0.42) return '早晨';
      if (t < 0.55) return '中午'; if (t < 0.72) return '下午'; if (t < 0.82) return '黃昏';
      if (t < 0.92) return '夜晚'; return '深夜';
    }

    function px(x, y, w, h, c) {
      ctx.fillStyle = c;
      ctx.fillRect(Math.floor(x), Math.floor(y), Math.ceil(w), Math.ceil(h));
    }
    // soft vertical gradient band (for sky/water depth)
    function gradV(x, y, w, h, c1, c2, steps) {
      steps = steps || Math.max(4, Math.floor(h / 3));
      for (let i = 0; i < steps; i++) {
        const t = i / (steps - 1 || 1);
        px(x, y + (h * i) / steps, w, Math.ceil(h / steps) + 1, lerpColor(c1, c2, t));
      }
    }
    // deterministic tiny noise (stable per cell, not flicker)
    function noise01(x, y, seed) {
      const n = Math.sin((x * 12.9898 + y * 78.233 + (seed || 0) * 45.164) * 43758.5453);
      return n - Math.floor(n);
    }
    // fill rect with subtle grain / CRT-ish pixel variation
    function pxNoise(x, y, w, h, c, amount, seed) {
      amount = amount == null ? 0.06 : amount;
      seed = seed || 1;
      const stepsX = Math.max(1, Math.floor(w));
      const stepsY = Math.max(1, Math.floor(h));
      // base fill
      px(x, y, w, h, c);
      // sparse noise dots (skip most cells for performance)
      for (let iy = 0; iy < stepsY; iy += 2) {
        for (let ix = 0; ix < stepsX; ix += 2) {
          const n = noise01(Math.floor(x) + ix, Math.floor(y) + iy, seed);
          if (n > 0.72) {
            const t = (n - 0.72) / 0.28 * amount;
            const brighter = n > 0.88;
            px(x + ix, y + iy, 1, 1, brighter
              ? lerpColor(c, '#ffffff', t * 0.9)
              : lerpColor(c, '#000000', t * 1.1));
          }
        }
      }
    }
    // wood plank with hairline gap + slight color drift + optional offset
    function woodPlank(x, y, w, h, base, gap, seed) {
      gap = gap == null ? 1 : gap;
      seed = seed || 3;
      const drift = (noise01(x, y, seed) - 0.5) * 0.08;
      const col = lerpColor(base, drift > 0 ? '#ffffff' : '#000000', Math.abs(drift));
      // main plank body inset by hairline gap on right/bottom
      pxNoise(x, y, Math.max(1, w - gap), Math.max(1, h - gap), col, 0.05, seed);
      // dark hairline gap (grid gap)
      if (gap > 0) {
        px(x + w - gap, y, gap, h, 'rgba(20,12,8,0.35)');
        px(x, y + h - gap, w, gap, 'rgba(20,12,8,0.28)');
      }
      // top rim micro-highlight
      px(x, y, Math.max(1, w - gap), 1, lerpColor(col, '#ffffff', 0.12));
    }
    // slightly misaligned brick/tile row
    function tileRow(x, y, count, tw, th, base, seed) {
      for (let i = 0; i < count; i++) {
        const mis = (noise01(x + i * tw, y, seed) > 0.82) ? 1 : 0; // occasional 1px offset
        const shade = (noise01(x + i, y, seed + 2) - 0.5) * 0.1;
        const col = lerpColor(base, shade > 0 ? '#ffffff' : '#000000', Math.abs(shade));
        pxNoise(x + i * tw, y + mis, tw - 1, th - 1, col, 0.07, seed + i);
        px(x + i * tw + tw - 1, y, 1, th, 'rgba(0,0,0,0.2)'); // vertical gap
      }
      px(x, y + th - 1, count * tw, 1, 'rgba(0,0,0,0.18)'); // horizontal gap
    }

    // ========== Cozy scene with light / depth / material ==========
    function drawSky(t) {
      let top = getSky(t);
      let mid = lerpColor(top, '#c8e0f0', 0.35);
      let bot = lerpColor(top, '#e8f4f8', 0.55);
      if (weather === 'rain') {
        top = lerpColor(top, '#5a6a7a', 0.45);
        mid = lerpColor(mid, '#6a7a8a', 0.4);
        bot = lerpColor(bot, '#7a8a9a', 0.35);
      } else if (weather === 'storm') {
        top = lerpColor(top, '#2a3545', 0.65);
        mid = lerpColor(mid, '#3a4555', 0.55);
        bot = lerpColor(bot, '#4a5565', 0.45);
      }
      gradV(0, 0, IW, 90, top, mid, 8);
      gradV(0, 90, IW, 58, mid, bot, 6);
      // sun only when clear & daytime
      if (weather === 'clear' && t > 0.25 && t < 0.8) {
        const sx = IW * 0.72, sy = 48;
        ctx.fillStyle = 'rgba(255,240,180,0.12)';
        ctx.beginPath(); ctx.arc(sx, sy, 55, 0, Math.PI*2); ctx.fill();
        ctx.fillStyle = 'rgba(255,230,150,0.18)';
        ctx.beginPath(); ctx.arc(sx, sy, 28, 0, Math.PI*2); ctx.fill();
        px(sx - 8, sy - 8, 16, 16, '#ffe8a0');
        px(sx - 5, sy - 5, 10, 10, '#fff5c8');
      }
    }

    function drawClouds(t) {
      const alpha = (t > 0.2 && t < 0.85) ? 0.92 : 0.22;
      ctx.globalAlpha = alpha;
      const o = (cloudOffset * 0.2) % (IW + 100);
      const stormy = weather !== 'clear';
      const c1 = stormy ? '#6a7080' : '#f8f4e8';
      const c2 = stormy ? '#4a5060' : '#e8e0d0';
      const c3 = stormy ? '#8a90a0' : '#fffef8';
      function softCloud(cx, cy, sc) {
        px(cx, cy, 50*sc, 18*sc, c1);
        px(cx+12*sc, cy-12*sc, 36*sc, 16*sc, c1);
        px(cx+28*sc, cy-6*sc, 28*sc, 14*sc, c1);
        px(cx+8*sc, cy+4*sc, 40*sc, 8*sc, c2);
        px(cx+14*sc, cy-10*sc, 20*sc, 4*sc, c3);
      }
      softCloud(20 - o*0.5, 28, 1.2);
      softCloud(160 + o*0.3, 18, 1.4);
      softCloud(280 - o*0.4, 35, 1.0);
      ctx.globalAlpha = 1;
    }

    function drawBirds() {
      const birds = [
        [80 + Math.sin(birdPhase)*20, 40 + Math.sin(birdPhase*1.3)*5],
        [200 + Math.cos(birdPhase*0.8)*30, 25],
        [320 + Math.sin(birdPhase*0.6)*15, 45],
        [150, 55 + Math.cos(birdPhase)*4]
      ];
      birds.forEach(([bx, by], i) => {
        const flap = Math.sin(birdPhase * 3 + i) * 3;
        ctx.strokeStyle = '#6a7a8a';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(bx - 5, by + flap);
        ctx.lineTo(bx, by);
        ctx.lineTo(bx + 5, by + flap);
        ctx.stroke();
        // tiny body
        px(bx - 1, by - 1, 3, 2, '#7a8a9a');
      });
    }

    function drawWeatherFX() {
      if (weather === 'clear') return;
      // rain drops
      const density = weather === 'storm' ? 90 : 45;
      while (rainDrops.length < density) {
        rainDrops.push({
          x: Math.random() * (IW + 40) - 20,
          y: Math.random() * IH,
          len: weather === 'storm' ? 8 + Math.random() * 8 : 5 + Math.random() * 5,
          spd: weather === 'storm' ? 4 + Math.random() * 3 : 2.5 + Math.random() * 2,
          drift: weather === 'storm' ? 1.2 : 0.6
        });
      }
      ctx.strokeStyle = weather === 'storm' ? 'rgba(180,200,220,0.55)' : 'rgba(200,220,240,0.4)';
      ctx.lineWidth = 1.2;
      rainDrops.forEach(d => {
        ctx.beginPath();
        ctx.moveTo(d.x, d.y);
        ctx.lineTo(d.x + d.drift, d.y + d.len);
        ctx.stroke();
      });
      // lightning flash overlay
      if (lightningFlash > 0) {
        ctx.fillStyle = `rgba(220,230,255,${lightningFlash * 0.45})`;
        ctx.fillRect(0, 0, IW, IH);
      }
      // storm dark vignette
      if (weather === 'storm') {
        ctx.fillStyle = 'rgba(20,30,50,0.18)';
        ctx.fillRect(0, 0, IW, IH);
      }
    }

    function drawWater(t) {
      const baseY = 148;
      const deep = getWater(t);
      const shallow = lerpColor(deep, '#a8d0e8', 0.35);
      gradV(0, baseY, IW, IH - baseY, shallow, deep, 10);
      // surface sheen strip
      px(0, baseY, IW, 2, 'rgba(255,255,255,0.12)');
      px(0, baseY + 2, IW, 1, 'rgba(255,255,255,0.05)');
      // animated specular highlights
      for (let i = 0; i < 12; i++) {
        const wx = (i * 42 + wavePhase * 14) % (IW + 50) - 25;
        const wy = baseY + 8 + Math.sin(wavePhase * 0.95 + i * 0.7) * 2.2;
        px(wx, wy, 18 + (i%3)*4, 2, 'rgba(255,255,255,0.2)');
        px(wx + 3, wy + 3, 10, 1, 'rgba(255,255,255,0.08)');
      }
      // depth darkening near bottom
      px(0, IH - 18, IW, 18, 'rgba(10,30,50,0.2)');
    }

    function drawPerson(castP, tipX, tipY) {

      px(px0 + 9, py + 18, 2, 4, '#2a3a1a');
      px(px0 + 14, py + 16, 9, 13, '#4a5a3a');
      px(px0 + 14, py + 16, 3, 13, '#3a4a2a');
      px(px0 + 20, py + 18, 2, 4, '#2a3a1a');

      // torso / vest
      px(px0 + 4, py + 2, 18, 16, '#3a6a9a');
      px(px0 + 4, py + 2, 5, 16, '#2a5a8a');
      px(px0 + 14, py + 3, 7, 8, '#5a8ab8');
      px(px0 + 3, py + 4, 20, 12, '#5a6a40');
      px(px0 + 3, py + 4, 4, 12, '#4a5a30');
      px(px0 + 16, py + 5, 6, 6, '#6a7a50');
      px(px0 + 6, py + 8, 5, 5, '#3a4a28');
      px(px0 + 13, py + 8, 5, 5, '#3a4a28');
      px(px0 + 6, py + 8, 5, 1, '#7a8a60');
      px(px0 + 13, py + 8, 5, 1, '#7a8a60');
      px(px0 + 4, py + 15, 18, 3, '#5a3a1a');
      px(px0 + 11, py + 15, 4, 3, '#c4a050');

      // head
      px(px0 + 7, py - 10, 13, 13, '#e8c4a0');
      px(px0 + 7, py - 10, 3, 11, '#d4a888');
      px(px0 + 15, py - 6, 4, 5, '#f0d4b0');
      px(px0 + 6, py - 5, 2, 4, '#d4a888');
      // two eyes (clearly visible)
      px(px0 + 10, py - 6, 3, 3, '#fff');
      px(px0 + 11, py - 5, 2, 2, '#2a2a2a');
      px(px0 + 15, py - 6, 3, 3, '#fff');
      px(px0 + 16, py - 5, 2, 2, '#2a2a2a');
      // small smile
      px(px0 + 12, py + 0, 6, 2, '#c4a888');
      px(px0 + 13, py + 1, 4, 1, '#d08070');

      // hat
      px(px0 + 3, py - 12, 20, 4, '#e0c878');
      px(px0 + 3, py - 12, 20, 1, '#f0e0a0');
      px(px0 + 6, py - 19, 14, 8, '#e0c878');
      px(px0 + 6, py - 19, 14, 2, '#f0e0a0');
      px(px0 + 6, py - 12, 14, 2, '#c4a858');
      px(px0 + 8, py - 17, 3, 3, '#8a7030');
      px(px0 + 14, py - 17, 2, 2, '#6a8a4a');

      // arm + cast
      let armX = px0 + 20, armY = py + 7;
      let handX = armX + 12, handY = armY + 2;
      if (castP > 0 && castP < 1) {
        if (castP < 0.35) {
          const w = castP / 0.35;
          handX = armX + 4 - w * 18;
          handY = armY - w * 24;
        } else {
          const f = (castP - 0.35) / 0.65;
          handX = armX - 14 + f * 40;
          handY = armY - 24 + f * 30;
        }
      }
      ctx.strokeStyle = '#3a6a9a';
      ctx.lineWidth = 7;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(armX + 2, armY + 3);
      ctx.lineTo((armX + handX) / 2, (armY + handY) / 2);
      ctx.stroke();
      ctx.strokeStyle = '#e8c4a0';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo((armX + handX) / 2, (armY + handY) / 2);
      ctx.lineTo(handX, handY);
      ctx.stroke();
      px(handX - 2, handY - 2, 5, 5, '#e8c4a0');
      px(handX - 1, handY - 1, 2, 2, '#d4a888');

      // 更長寫實釣竿
      ctx.strokeStyle = '#2a1a0a';
      ctx.lineWidth = 2.8;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(handX, handY);
      ctx.lineTo(tipX, tipY);
      ctx.stroke();
      ctx.strokeStyle = 'rgba(180, 140, 70, 0.65)';
      ctx.lineWidth = 1.1;
      ctx.beginPath();
      ctx.moveTo(handX, handY - 1.3);
      ctx.lineTo(tipX, tipY - 1.3);
      ctx.stroke();
      // cork grip
      const hx = handX + (tipX - handX) * 0.06;
      const hy2 = handY + (tipY - handY) * 0.06;
      ctx.strokeStyle = '#c4a070';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(handX, handY);
      ctx.lineTo(hx, hy2);
      ctx.stroke();
      // reel
      const rx = handX + (tipX - handX) * 0.1;
      const ry = handY + (tipY - handY) * 0.1 + 3;
      px(rx - 3, ry - 2, 7, 5, '#4a4a4a');
      px(rx - 2, ry - 1, 5, 3, '#6a6a6a');
      px(rx, ry, 2, 2, '#8a8a8a');
      // guides along longer blank
      for (let g = 0.18; g <= 0.9; g += 0.14) {
        const gx = handX + (tipX - handX) * g;
        const gy = handY + (tipY - handY) * g;
        px(gx - 1, gy - 2, 3, 2, '#c0c0c0');
        px(gx, gy - 1, 1, 1, '#fff');
      }
      px(tipX - 2, tipY - 2, 4, 4, '#3a2a10');
      px(tipX - 1, tipY - 2, 2, 1, '#d4b070');
      px(tipX, tipY - 1, 2, 2, '#e8d090');
    }

    function drawHugeShadow(cx, cy, intensity, time) {
      // 水下巨大魚影（橢圓、緩緩移動）
      const sway = Math.sin(time * 0.002) * 8;
      const len = 70 + intensity * 40;
      const thick = 18 + intensity * 12;
      ctx.save();
      ctx.translate(cx + sway, cy + 8);
      ctx.rotate(Math.sin(time * 0.0015) * 0.12);
      ctx.fillStyle = `rgba(10, 25, 40, ${0.18 + intensity * 0.35})`;
      ctx.beginPath();
      ctx.ellipse(0, 0, len / 2, thick / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      // 更暗的核心
      ctx.fillStyle = `rgba(5, 15, 30, ${0.15 + intensity * 0.25})`;
      ctx.beginPath();
      ctx.ellipse(-len * 0.08, 0, len * 0.28, thick * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      // 尾部細長影
      ctx.fillStyle = `rgba(10, 25, 40, ${0.12 + intensity * 0.2})`;
      ctx.beginPath();
      ctx.ellipse(-len * 0.42, 0, len * 0.18, thick * 0.2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawRipples(cx, cy, intensity, time) {
      if (intensity <= 0) return;
      ctx.strokeStyle = `rgba(200,230,255,${0.25 + intensity * 0.4})`;
      ctx.lineWidth = 1.5;
      for (let i = 1; i <= 4; i++) {
        const r = 6 + i * 7 + Math.sin(time * 0.01 + i) * 2;
        ctx.beginPath();
        ctx.arc(cx, cy + 2, r * intensity, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    function drawBubbles() {
      bubbles.forEach(b => {
        const a = Math.max(0, 1 - b.life);
        px(b.x, b.y, b.s, b.s, `rgba(200,230,255,${a * 0.65})`);
      });
    }

    // Pixel fish / trash

    function drawPixelFish(x, y, fish, s) {
      s = s || 1;
      const isBig = fish.size === 'big';
      const col = fish.color;
      const fin = fish.fin || col;
      const dark = lerpColor(col, '#000000', 0.28);
      const light = lerpColor(col, '#ffffff', 0.22);
      const belly = lerpColor(col, '#f5f0e0', 0.35);
      const u = v => v * s; // unit scale

      if (isBig) {
        // elongated body (trout / carp profile)
        px(x - u(14), y - u(4), u(28), u(10), col);
        px(x - u(12), y - u(6), u(22), u(4), light); // back highlight
        px(x - u(12), y + u(3), u(24), u(4), belly); // belly
        px(x - u(14), y - u(2), u(3), u(8), dark); // rear shade
        // head taper
        px(x + u(12), y - u(3), u(8), u(8), col);
        px(x + u(16), y - u(1), u(5), u(5), light);
        // snout
        px(x + u(20), y, u(4), u(3), belly);
        // eye
        px(x + u(16), y - u(2), u(3), u(3), '#fff');
        px(x + u(17), y - u(1), u(2), u(2), '#1a1a1a');
        px(x + u(17), y - u(1), u(1), u(1), '#fff');
        // caudal (tail) fin forked
        px(x - u(20), y - u(6), u(8), u(5), fin);
        px(x - u(20), y + u(2), u(8), u(5), fin);
        px(x - u(22), y - u(7), u(4), u(3), dark);
        px(x - u(22), y + u(5), u(4), u(3), dark);
        // dorsal fin
        px(x - u(2), y - u(10), u(10), u(5), fin);
        px(x, y - u(11), u(6), u(2), light);
        // anal / pelvic
        px(x - u(2), y + u(6), u(6), u(3), fin);
        px(x + u(6), y + u(5), u(4), u(3), fin);
        // gill line
        px(x + u(10), y - u(3), u(1), u(7), dark);
        // scale-ish mid dots
        for (let i = 0; i < 4; i++) px(x - u(8) + i * u(5), y, u(2), u(1), light);
      } else {
        // small fish compact profile
        px(x - u(8), y - u(3), u(16), u(7), col);
        px(x - u(7), y - u(4), u(12), u(3), light);
        px(x - u(7), y + u(2), u(13), u(3), belly);
        px(x - u(8), y - u(1), u(2), u(5), dark);
        // head
        px(x + u(6), y - u(2), u(5), u(5), col);
        px(x + u(9), y - u(1), u(3), u(3), light);
        // eye
        px(x + u(8), y - u(1), u(2), u(2), '#fff');
        px(x + u(9), y, u(1), u(1), '#111');
        // tail
        px(x - u(12), y - u(4), u(5), u(4), fin);
        px(x - u(12), y + u(1), u(5), u(4), fin);
        px(x - u(14), y - u(3), u(3), u(2), dark);
        px(x - u(14), y + u(3), u(3), u(2), dark);
        // dorsal
        px(x - u(1), y - u(6), u(5), u(3), fin);
        // ventral
        px(x + u(1), y + u(4), u(3), u(2), fin);
        // gill
        px(x + u(5), y - u(2), u(1), u(4), dark);

      px(x - u(40), y - u(12), u(14), u(10), fin);

      // gill
      px(x + u(16), y - u(5), u(2), u(12), dark);
      // scale highlights
      for (let i = 0; i < 6; i++) px(x - u(16) + i * u(6), y - u(1), u(3), u(2), light);

    function drawPixelRuby(x, y, s) {
      s = s || 1.2;
      const u = v => v * s;
      // faceted gem silhouette
      // top facet
      px(x - u(4), y - u(12), u(8), u(4), '#ff6a8a');
      px(x - u(6), y - u(8), u(12), u(4), '#e02050');
      // mid body
      px(x - u(8), y - u(4), u(16), u(10), '#c01040');
      px(x - u(6), y - u(2), u(6), u(8), '#ff4a70'); // left light
      px(x + u(2), y, u(4), u(6), '#8a0028'); // right dark
      // bottom point
      px(x - u(5), y + u(6), u(10), u(4), '#a00830');
      px(x - u(3), y + u(10), u(6), u(3), '#7a0020');
      px(x - u(1), y + u(13), u(2), u(2), '#5a0018');
      // specular highlight
      px(x - u(4), y - u(6), u(3), u(3), '#ffb0c0');
      px(x - u(3), y - u(5), u(1), u(1), '#fff');
      // edge glints
      px(x + u(4), y - u(2), u(2), u(2), '#ff8aa0');
      px(x - u(7), y + u(2), u(2), u(2), '#ff6a8a');
    }

    function drawLoot(progress, loot) {
      const baseX = 250, baseY = 168 - progress * 68;
      if (!loot) return;
      if (loot.type === 'trash') drawPixelTrash(baseX, baseY, loot.data, 1.15);
      else if (loot.type === 'nessie') drawPixelNessie(baseX, baseY, 1.0);
      else if (loot.type === 'huge') drawPixelHugeFish(baseX, baseY, loot.data, 1.4);
      else if (loot.type === 'ruby') drawPixelRuby(baseX, baseY, 1.35);
      else drawPixelFish(baseX, baseY, loot.data, 1.2);
    }

    function draw(time) {
      // 先清掉整張畫布，避免縮放後上下左右白邊／雨後殘影
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = '#7eb8d4';
      ctx.fillRect(0, 0, W, H);

      ctx.save();
      const ox = (W - IW * scale) / 2;
      const oy = (H - IH * scale) / 2;
      // screen shake (pixels in screen space)
      let shx = 0, shy = 0;
      if (screenShake > 0.01) {
        const mag = screenShake * 10 * scale;
        shx = (Math.random() - 0.5) * mag;
        shy = (Math.random() - 0.5) * mag;
      }
      ctx.translate(ox + shx, oy + shy);
      ctx.scale(scale, scale);
      // 裁切在遊戲解析度內，避免雨滴／特效畫出邊界形成白邊
      ctx.beginPath();
      ctx.rect(0, 0, IW, IH);
      ctx.clip();
      px(0, 0, IW, IH, '#7eb8d4');

      drawSky(dayTime);
      drawClouds(dayTime);
      drawBirds();
      drawWater(dayTime);
      // rain drawn later after world so it overlays
      drawShore();
      drawCabin();
      drawReeds();
      drawDock();
      drawBoat();
      drawDog();

      // 竿尖／浮標基準（碼頭漁夫，竿更長）
      let tipX = 210, tipY = 112;
      let bobX = 270, bobY = 172;

      if (state === 'casting') {
        const p = castProgress;
        if (p < 0.35) {
          const w = p / 0.35;
          tipX = 210 - w * 45;
          tipY = 112 - w * 38;
          bobX = 210 - w * 28;
          bobY = 112 - w * 18;
        } else {
          const f = (p - 0.35) / 0.65;
          tipX = 165 + f * 60;
          tipY = 74 + f * 42;
          bobX = 185 + f * 95;
          bobY = 90 - Math.sin(f * Math.PI) * 52 + f * 82;
          if (f > 0.85) bobY = 172;
        }
      } else if (state === 'waiting' || state === 'pulling') {
        tipX = 215;
        tipY = 110 + Math.sin(bobberPhase * 0.5) * 1.2;
        bobX = 270;
        bobY = 172 + Math.sin(bobberPhase) * 3.2;
        if (state === 'pulling') {
          const struggle = pullStruggle > 0 ? (Math.sin(time * 0.04) * 10 + Math.sin(time * 0.09) * 6) * pullStruggle : 0;
          tipX = 215 + struggle * 0.35;
          tipY = 110 + Math.sin(bobberPhase * 0.5) * 1.2 + struggle * 0.25;
          bobX = 270 + struggle;
          bobY = 172 - pullProgress * 65 + Math.abs(struggle) * 0.4;
        }
      }

      drawPerson(castProgress, tipX, tipY);
      if (state === 'casting' || state === 'waiting' || state === 'pulling') {
        drawLineAndBobber(tipX, tipY, bobX, bobY);
      }
      drawWeatherFX();
      if (state === 'waiting' && nearFish) {
        const intensity = Math.min(1, (waitElapsed - (waitTime - nearWindow)) / Math.max(1, nearWindow));
        if (pendingLoot && (pendingLoot.type === 'huge' || pendingLoot.type === 'nessie')) {
          drawHugeShadow(bobX, bobY + 6, intensity, time);
        }
        // 垃圾幾乎無感；小魚小；大魚明顯；超大型最大
        let rippleScale = 1;
        if (pendingLoot) {
          if (pendingLoot.type === 'trash') rippleScale = 0.18;
          else if (pendingLoot.type === 'small') rippleScale = 0.35;
          else if (pendingLoot.type === 'big') rippleScale = 0.9;
          else rippleScale = 1.15; // huge / nessie / ruby
        }
        drawRipples(bobX, bobY + 2, (0.5 + intensity * 0.5) * rippleScale, time);
      }
      drawBubbles();
      if (state === 'pulling') drawLoot(pullProgress, currentLoot);

      ctx.restore();
    }

    // ========== Logic ==========
    function setStatus(t) { document.getElementById('status-box').textContent = t; }

    function startCast() {
      if (state !== 'idle') return;
      if (document.getElementById('question-modal').classList.contains('show') ||
          document.getElementById('result-modal').classList.contains('show') ||
          document.getElementById('collection-modal').classList.contains('show') ||
          document.getElementById('achievement-modal').classList.contains('show')) return;
      state = 'casting';
      castProgress = 0;
      nearFish = false;
      bubbles = [];
      setStatus('揮竿中…');
      document.getElementById('instruction').style.display = 'none';
      AudioSys.cast();
      stats.casts = (stats.casts || 0) + 1;
      saveStats();
      unlockAch('first_cast');
      if (stats.casts >= 10) unlockAch('cast_10');
      if (stats.casts >= 30) unlockAch('cast_30');
    }

    function beginWaiting() {
      state = 'waiting';
      waitElapsed = 0;
      bobberPhase = 0;
      pendingLoot = rollLoot(); // 預先決定，才能顯示巨大影子
      // 依體型拉開等待時間
      const t = pendingLoot.type;
      if (t === 'trash') waitTime = 4000 + Math.random() * 4000;       // 4–8s
      else if (t === 'small') waitTime = 7000 + Math.random() * 8000;  // 7–15s
      else if (t === 'big') waitTime = 10000 + Math.random() * 10000;  // 10–20s
      else if (t === 'huge' || t === 'nessie') waitTime = 14000 + Math.random() * 12000; // 14–26s
      else waitTime = 12000 + Math.random() * 10000; // ruby etc
      nearWindow = t === 'trash' ? 1800 : t === 'small' ? 3000 : t === 'big' ? 4500 : 5500;
      setStatus('等待中…');
      AudioSys.splash(false);
    }

    function rollLoot() {
      const r = Math.random();
      // 垃圾 ~47.9% / 小魚 38% / 大魚 8% / 超大型 5% / ??? 1% / 紅寶石 0.1%
      if (r < 0.479) return { type: 'trash', data: TRASH_ITEMS[Math.floor(Math.random()*TRASH_ITEMS.length)] };
      if (r < 0.859) {
        const s = FRESHWATER_FISH.filter(f => f.size === 'small');
        return { type: 'small', data: s[Math.floor(Math.random()*s.length)] };
      }
      if (r < 0.939) {
        const b = FRESHWATER_FISH.filter(f => f.size === 'big');
        return { type: 'big', data: b[Math.floor(Math.random()*b.length)] };
      }
      if (r < 0.989) {
        return { type: 'huge', data: HUGE_FISH[Math.floor(Math.random()*HUGE_FISH.length)] };
      }
      if (r < 0.999) {
        return { type: 'nessie', data: { name: '???', desc: '傳說中的尼斯湖水怪竟然出現在這裡！！！' } };
      }
      return { type: 'ruby', data: { name: '紅寶石', desc: '極為罕見的湖底紅寶石！在陽光下閃著深紅色的光。' } };
    }

    function startPull() {
      state = 'pulling';
      pullProgress = 0;
      currentLoot = pendingLoot || rollLoot();
      pendingLoot = null;
      const isHuge = currentLoot && (currentLoot.type === 'huge' || currentLoot.type === 'nessie');
      const isRuby = currentLoot && currentLoot.type === 'ruby';
      setStatus(isRuby ? '閃閃發光…！！' : (isHuge ? '超大魚拉扯中！！' : '中魚了！！'));
      AudioSys.reel();
      if (isHuge) {
        screenShake = 1;
        pullStruggle = 1;
        // extra heavy tug sounds
        setTimeout(() => AudioSys.reel(), 180);
        setTimeout(() => AudioSys.splash(true), 320);
        setTimeout(() => AudioSys.reel(), 500);
        // vibration if supported (mobile)
        try {
          if (navigator.vibrate) navigator.vibrate([40, 60, 40, 80, 50, 100, 40]);
        } catch (e) {}
      } else {
        screenShake = 0.25;
        pullStruggle = 0;
        try { if (navigator.vibrate) navigator.vibrate(30); } catch (e) {}
      }
    }

    function finishPull() {
      state = 'result';
      // 脫鉤：垃圾 5%、小魚 8%、大魚 12%、超大型 18%、傳說 10%
      let escapeChance = 0.08;
      if (currentLoot.type === 'trash') escapeChance = 0.05;
      else if (currentLoot.type === 'small') escapeChance = 0.08;
      else if (currentLoot.type === 'big') escapeChance = 0.12;
      else if (currentLoot.type === 'huge') escapeChance = 0.18;
      else if (currentLoot.type === 'nessie') escapeChance = 0.10;
      else if (currentLoot.type === 'ruby') escapeChance = 0.15;
      if (Math.random() < escapeChance) {
        showEscapeResult();
        return;
      }
      const isNew = markCollected(currentLoot);
      if (isNew) showNewCatchFlash(currentLoot);
      if (currentLoot.type === 'trash') {
        AudioSys.trash();
        showLootResult();
      } else if (currentLoot.type === 'ruby') {
        AudioSys.catchOK(true);
        showRubyResult();
      } else {
        AudioSys.catchOK(currentLoot.type === 'huge' || currentLoot.type === 'nessie');
        const isQuestionFish = Math.random() < 0.5;
        if (isQuestionFish) showQuestionFlow();
        else showFishOnlyResult();
      }
    }

      lc.clearRect(0,0,80,60); lc.fillStyle='#0a2030'; lc.fillRect(0,0,80,60);

      document.getElementById('ok-btn').onclick = () => { modal.classList.remove('show'); resetToIdle(); };

        document.getElementById('result-title').textContent = currentLoot.type === 'big' ? '大魚上鉤！' : '小魚上鉤！';
        document.getElementById('loot-desc').innerHTML = '<b>' + currentLoot.data.name + '</b><br>它變成了一道商研社題目！';
        fishCaught += currentLoot.type === 'big' ? 3 : 1;
      }
      document.getElementById('score-box').textContent = '魚獲 ' + fishCaught;
      saveGameSave();
      drawLootPreview(currentLoot);
      document.getElementById('ok-btn').onclick = () => { modal.classList.remove('show'); showQuestion(); };
      modal.classList.add('show');
    }

    function showQuestion() {
      let available = questions.map((_, i) => i).filter(i => !answered.has(i));
      if (available.length === 0) { answered.clear(); available = questions.map((_, i) => i); }
      const idx = available[Math.floor(Math.random() * available.length)];
      const base = questions[idx];
      // 打亂選項順序，並重算正確答案索引
      const order = base.options.map((_, i) => i);
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = order[i]; order[i] = order[j]; order[j] = tmp;
      }
      const shuffledOpts = order.map(i => base.options[i]);
      const newAnswer = order.indexOf(base.answer);
      let tag = base.tag || '';
      if (!tag) {
        const qq = base.q;
        if (qq.indexOf('MECE') >= 0) tag = '本週社課 · MECE';
        else if (qq.indexOf('費米') >= 0) tag = '本週社課 · 費米';
        else if (qq.indexOf('簡報') >= 0) tag = '本週社課 · 簡報';
        else if (qq.indexOf('競品') >= 0) tag = '本週社課 · 競品分析';
        else if (qq.indexOf('產業') >= 0 || qq.indexOf('波特') >= 0) tag = '本週社課 · 產業分析';
        else if (qq.indexOf('Prime') >= 0 || qq.indexOf('一頁') >= 0) tag = '本週社課 · Prime';
        else if (qq.indexOf('假設') >= 0 || qq.indexOf('個案') >= 0 || qq.indexOf('洞察') >= 0) tag = '本週社課 · 分析思維';
        else tag = '本週社課相關';
      }
      currentQ = { q: base.q, options: shuffledOpts, answer: newAnswer, explain: base.explain, idx, tag };

      document.getElementById('q-text').innerHTML = (currentQ.tag ? '<span style="color:#ffd780;font-size:12px;">' + currentQ.tag + '</span><br>' : '') + currentQ.q;
      const optionsDiv = document.getElementById('options');
      optionsDiv.innerHTML = '';
      document.getElementById('result-msg').textContent = '';
      document.getElementById('close-btn').style.display = 'none';
      showingResult = false;
      currentQ.options.forEach((opt, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.textContent = (i+1) + '. ' + opt;
        btn.onclick = () => selectAnswer(i);
        optionsDiv.appendChild(btn);
      });
      document.getElementById('question-modal').classList.add('show');
    }

    function selectAnswer(selected) {
      if (showingResult) return;
      showingResult = true;
      document.querySelectorAll('.option-btn').forEach((b, i) => {
        b.disabled = true;
        if (i === currentQ.answer) b.classList.add('correct');
        else if (i === selected) b.classList.add('wrong');
      });
      const msg = document.getElementById('result-msg');
      const tagLine = currentQ.tag ? ('【' + currentQ.tag + '】') : '';
      stats.quizAnswered = (stats.quizAnswered || 0) + 1;
      if (currentQ.tag) {
        stats.quizTags = stats.quizTags || {};
        stats.quizTags[currentQ.tag] = true;
      }
      if (selected === currentQ.answer) {
        const bonus = 2;
        fishCaught += bonus;
        document.getElementById('score-box').textContent = '魚獲 ' + fishCaught;
        msg.textContent = '✅ 答對了！+' + bonus + ' 魚獲  ' + tagLine + (currentQ.explain || '');
        msg.style.color = '#7fff7f';
        answered.add(currentQ.idx);
        stats.quizCorrect = (stats.quizCorrect || 0) + 1;
        saveGameSave();
        AudioSys.correct();
      } else {
        msg.textContent = '❌ 答錯了～ 不扣分  ' + tagLine + (currentQ.explain || '');
        msg.style.color = '#ff9f9f';
        stats.quizWrong = (stats.quizWrong || 0) + 1;
        AudioSys.wrong();
      }
      saveStats();
      checkAchievements();
      document.getElementById('close-btn').style.display = 'inline-block';
    }

    document.getElementById('close-btn').onclick = () => {
      document.getElementById('question-modal').classList.remove('show');
      resetToIdle();
    };

    function resetToIdle() {
      state = 'idle';
      nearFish = false;
      bubbles = [];
      currentLoot = null;
      castProgress = 0;
      screenShake = 0;
      pullStruggle = 0;
      setStatus('準備中');
      document.getElementById('instruction').style.display = 'none';
    }

    // Collection UI
    function getRarity(ent) {
      if (ent.isNessie || ent.isRuby || ent.isHuge) return { key: 'legend', label: '傳說', cls: 'r-legend' };
      if (ent.kind === '大魚') return { key: 'rare', label: '稀有', cls: 'r-rare' };
      if (ent.isTrash) return { key: 'common', label: '普通', cls: 'r-common' };
      return { key: 'common', label: '普通', cls: 'r-common' };
    }

    function getAllEntries() {
      const entries = [];
      FRESHWATER_FISH.forEach(f => entries.push({ key: 'fish_'+f.name, name: f.name, kind: f.size==='big'?'大魚':'小魚', filter: f.size, isNessie:false, isTrash:false, isHuge:false, isRuby:false, data:f }));
      HUGE_FISH.forEach(f => entries.push({ key: 'fish_'+f.name, name: f.name, kind: '超大型', filter: 'huge', isNessie:false, isTrash:false, isHuge:true, isRuby:false, data:f }));
      TRASH_ITEMS.forEach(t => entries.push({ key: 'trash_'+t.name, name: t.name, kind: '垃圾', filter: 'trash', isNessie:false, isTrash:true, isHuge:false, isRuby:false, data:t }));
      entries.push({ key: 'nessie', name: '???', kind: '傳說', filter: 'legend', isNessie:true, isTrash:false, isHuge:false, isRuby:false, data:null });
      entries.push({ key: 'ruby', name: '紅寶石', kind: '傳說', filter: 'legend', isNessie:false, isTrash:false, isHuge:false, isRuby:true, data:{ name:'紅寶石' } });
      return entries;
    }

    function buildCollectionList() {
      const listEl = document.getElementById('collection-list');
      const statsEl = document.getElementById('collection-stats');
      listEl.innerHTML = '';
      const entries = getAllEntries();
      let found = 0, foundSmall=0, totalSmall=0, foundBig=0, totalBig=0, foundHuge=0, totalHuge=0, foundTrash=0, totalTrash=0, foundLeg=0, totalLeg=0;
      entries.forEach(ent => {
        const unlocked = !!collection[ent.key];
        if (unlocked) found++;
        if (ent.filter === 'small') { totalSmall++; if (unlocked) foundSmall++; }
        else if (ent.filter === 'big') { totalBig++; if (unlocked) foundBig++; }
        else if (ent.filter === 'huge') { totalHuge++; if (unlocked) foundHuge++; }
        else if (ent.filter === 'trash') { totalTrash++; if (unlocked) foundTrash++; }
        else if (ent.filter === 'legend') { totalLeg++; if (unlocked) foundLeg++; }
      });
      const filtered = entries.filter(ent => {
        if (colFilter === 'all') return true;
        return ent.filter === colFilter;
      });
      filtered.forEach(ent => {
        const unlocked = !!collection[ent.key];
        const rarity = getRarity(ent);
        const div = document.createElement('div');
        div.className = 'col-item' + (unlocked ? '' : ' locked');
        const cnv = document.createElement('canvas');
        cnv.className = 'col-icon';
        cnv.width = 52; cnv.height = 36;
        const c = cnv.getContext('2d');
        c.imageSmoothingEnabled = false;
        c.fillStyle = '#0a2840'; c.fillRect(0,0,52,36);
        const p = (x,y,w,h,col) => { c.fillStyle = col; c.fillRect(x|0,y|0,Math.max(1,w|0),Math.max(1,h|0)); };
        const mix = (a,b,t) => {
          const ph = s => { const h=parseInt(s.slice(1),16); return [(h>>16)&255,(h>>8)&255,h&255]; };
          const A=ph(a), B=ph(b.length===7?b:'#888888');
          return 'rgb('+[0,1,2].map(i=>Math.round(A[i]+(B[i]-A[i])*t)).join(',')+')';
        };
        if (unlocked) {
          if (ent.isNessie) {
            p(4,18,34,11,'#2f6b4e'); p(6,16,30,4,'#5a9a72'); p(6,25,30,4,'#1e4a35');
            p(12,8,11,12,'#2f6b4e'); p(14,6,7,3,'#5a9a72');
            p(24,7,12,13,'#2f6b4e'); p(26,5,8,3,'#5a9a72');
            p(34,2,8,16,'#2f6b4e'); p(36,1,3,14,'#5a9a72');
            p(38,0,12,9,'#2f6b4e'); p(42,1,6,3,'#5a9a72');
            p(44,2,3,3,'#f0e8a0'); p(45,3,2,2,'#111');
            p(0,16,7,8,'#1e4a35'); p(0,14,4,4,'#2f6b4e'); p(0,22,4,4,'#2f6b4e');
          } else if (ent.isRuby) {
            p(22,4,8,4,'#ff6a8a'); p(20,8,12,5,'#e02050'); p(18,13,16,12,'#c01040');
            p(20,14,6,8,'#ff4a70'); p(28,16,4,6,'#8a0028');
            p(20,25,12,4,'#a00830'); p(22,29,8,3,'#7a0020');
            p(21,12,3,3,'#ffb0c0'); p(22,13,1,1,'#fff');
          } else if (ent.isTrash) {
            const t = ent.data.type;
            if (t==='bottle') {
              p(20,8,12,22,'#b8e0ec'); p(22,4,8,5,'#9ad0e0'); p(23,2,6,3,'#2a8a4a');
            } else if (t==='bear') {
              p(14,14,24,16,'#c4a06a'); p(16,6,8,10,'#c4a06a'); p(28,6,8,10,'#c4a06a');
            } else if (t==='can') {
              p(16,8,20,22,'#b0b0b0'); p(18,14,16,7,'#c0392b');
            } else {
              p(12,12,28,14,'#aaa');
            }
          } else if (ent.isHuge) {
            const col = ent.data.color, fin = ent.data.fin||col;
            p(4,12,40,14,col); p(36,12,12,12,col); p(40,13,3,3,'#fff');
            p(0,8,8,8,fin); p(0,20,8,8,fin);
          } else {
            const col = ent.data.color, fin = ent.data.fin||col;
            const isBig = ent.data.size==='big';
            if (isBig) {
              p(8,12,30,12,col); p(32,13,10,9,col); p(36,13,3,3,'#fff');
              p(2,8,8,6,fin); p(2,20,8,6,fin);
            } else {
              p(12,13,24,10,col); p(30,14,8,7,col); p(32,14,2,2,'#fff');
              p(6,10,7,5,fin); p(6,20,7,5,fin);
            }
          }
        } else {
          p(12,10,28,16,'#1a2a3a');
          c.fillStyle='#3a4a5a'; c.font='16px monospace'; c.textAlign='center'; c.fillText('?',26,22);
        }
        const nameSpan = document.createElement('span');
        nameSpan.className = 'col-name';
        nameSpan.textContent = ent.isNessie ? (unlocked ? '???（尼斯湖水怪）' : '???') : (unlocked ? ent.name : '???');
        const tag = document.createElement('span');
        tag.className = 'col-tag';
        tag.innerHTML = unlocked
          ? (ent.kind + ' ×' + (collection[ent.key].count||1) + ' <span class="col-rarity ' + rarity.cls + '">' + rarity.label + '</span>')
          : '未發現';
        div.appendChild(cnv); div.appendChild(nameSpan); div.appendChild(tag);
        listEl.appendChild(div);
      });
      statsEl.innerHTML = '已發現 <b>' + found + ' / ' + entries.length + '</b><br>' +
        '<span style="font-size:11px;opacity:0.9;">垃' + foundTrash + '/' + totalTrash +
        ' · 小' + foundSmall + '/' + totalSmall +
        ' · 大' + foundBig + '/' + totalBig +
        ' · 巨' + foundHuge + '/' + totalHuge +
        ' · 傳' + foundLeg + '/' + totalLeg + '</span>';
      const bar = document.getElementById('col-progress-bar');
      if (bar) bar.style.width = (entries.length ? (found / entries.length * 100) : 0) + '%';
      const share = document.getElementById('share-box');
      if (share) {
        share.style.display = 'block';
        share.textContent = '我在商研社碼頭收錄了 ' + found + '/' + entries.length + ' 種！歡迎來社博攤位一起釣魚～';
      }
    }

    function openCollection() { buildCollectionList(); document.getElementById('collection-modal').classList.add('show'); }
    function closeCollection() { document.getElementById('collection-modal').classList.remove('show'); }

    function onPointer(e) {
      e.preventDefault();
      if (!gameStarted) return;
      startCast();
    }
    canvas.addEventListener('click', onPointer);
    window.addEventListener('pagehide', saveGameSave);
    window.addEventListener('beforeunload', saveGameSave);
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveGameSave(); });
    canvas.addEventListener('touchstart', onPointer, { passive: false });

    document.getElementById('start-btn').onclick = () => {
      document.getElementById('start-screen').style.display = 'none';
      gameStarted = true;
      document.getElementById('instruction').style.display = 'none';
      document.getElementById('collection-btn').style.display = 'block';
      const muteBtn = document.getElementById('mute-btn');
      if (muteBtn) muteBtn.style.display = 'block';
      const resetBtn = document.getElementById('reset-btn');
      if (resetBtn) resetBtn.style.display = 'block';
      const achBtn = document.getElementById('ach-btn');
      if (achBtn) achBtn.style.display = 'block';
      document.getElementById('score-box').textContent = '魚獲 ' + fishCaught;
      // 短教學：自動出現後消失
      const toast = document.getElementById('tutorial-toast');
      if (toast && !tutorialShown) {
        toast.style.display = 'block';
        toast.style.opacity = '1';
        tutorialShown = true;
        setTimeout(() => {
          toast.style.opacity = '0';
          setTimeout(() => { toast.style.display = 'none'; }, 500);
        }, 4500);
      }
      AudioSys.resume();
      AudioSys.startBgm();
      lastTime = performance.now();
      requestAnimationFrame(loop);
    };
    document.getElementById('collection-btn').onclick = (e) => { e.stopPropagation(); openCollection(); };
    document.getElementById('ach-btn').onclick = (e) => { e.stopPropagation(); openAchievements(); };
    document.getElementById('ach-close-btn').onclick = (e) => { e.stopPropagation(); closeAchievements(); };
    document.getElementById('achievement-modal').onclick = (e) => { if (e.target.id === 'achievement-modal') closeAchievements(); };
    document.getElementById('col-tabs').addEventListener('click', (e) => {
      const btn = e.target.closest('.col-tab');
      if (!btn) return;
      e.stopPropagation();
      colFilter = btn.getAttribute('data-filter') || 'all';
      document.querySelectorAll('.col-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      buildCollectionList();
    });
    document.getElementById('reset-btn').onclick = (e) => {
      e.stopPropagation();
      if (!confirm('確定清除魚獲、圖鑑與答題進度？')) return;
      try {
        localStorage.removeItem(SAVE_KEY);
        localStorage.removeItem(COLLECTION_KEY);
        localStorage.removeItem(ACH_KEY);
        localStorage.removeItem('shangyan_stats_v1');
      } catch (err) {}
      collection = {};
      fishCaught = 0;
      answered = new Set();
      achievementsUnlocked = {};
      stats = { casts:0, escapes:0, trash:0, small:0, big:0, huge:0, quizAnswered:0, quizCorrect:0, quizWrong:0, newUnlocks:0, sawRain:false, sawStorm:false, sawNight:false, gotTrash:false, gotLegend:false, quizTags:{} };
      document.getElementById('score-box').textContent = '魚獲 0';
      saveGameSave();
      alert('存檔已清除');
    };
    document.getElementById('mute-btn').onclick = (e) => {
      e.stopPropagation();
      const on = AudioSys.toggleBgm();
      document.getElementById('mute-btn').textContent = on ? '音樂 開' : '音樂 關';
    };
    document.getElementById('col-close-btn').onclick = () => closeCollection();
    document.getElementById('collection-modal').onclick = (e) => { if (e.target.id === 'collection-modal') closeCollection(); };

    function loop(now) {
      const dt = Math.min(now - lastTime, 50);
      lastTime = now;
      dayTime = (dayTime + daySpeed * dt) % 1;
      document.getElementById('time-box').textContent = getTimeLabel(dayTime);
      if (getTimeLabel(dayTime) === '深夜' || getTimeLabel(dayTime) === '夜晚') {
        if (!stats.sawNight) { stats.sawNight = true; saveStats(); checkAchievements(); }
      }
      cloudOffset += dt * (weather === 'storm' ? 0.035 : weather === 'rain' ? 0.02 : 0.01);
      wavePhase += dt * (weather === 'storm' ? 0.006 : 0.0035);
      birdPhase += dt * 0.002;
      heartPhase += dt * 0.004;

      // --- weather system (small chance) ---
      weatherTimer -= dt;
      weatherCooldown -= dt;
      if (lightningFlash > 0) lightningFlash = Math.max(0, lightningFlash - dt * 0.004);
      if (weather === 'clear' && weatherCooldown <= 0) {
        const r = Math.random();
        // ~8% rain, ~3% storm when rolling
        if (r < 0.03) {
          weather = 'storm';
          weatherTimer = 18000 + Math.random() * 22000; // 18–40s
          rainDrops = [];
          setStatus('雷暴來襲！');
          AudioSys.startRain(true);
          stats.sawStorm = true; saveStats(); checkAchievements();
        } else if (r < 0.11) {
          weather = 'rain';
          weatherTimer = 20000 + Math.random() * 25000; // 20–45s
          rainDrops = [];
          setStatus('下雨了…');
          AudioSys.startRain(false);
          stats.sawRain = true; saveStats(); checkAchievements();
        }
        weatherCooldown = 50000 + Math.random() * 70000; // 50–120s between rolls
      } else if (weather !== 'clear' && weatherTimer <= 0) {
        weather = 'clear';
        rainDrops = [];
        lightningFlash = 0;
        AudioSys.stopRain();
        setStatus(state === 'idle' ? '準備中' : document.getElementById('status-box').textContent);
      }
      // update rain positions
      if (weather !== 'clear') {
        rainDrops.forEach(d => {
          d.y += d.spd;
          d.x += d.drift * 0.4;
          if (d.y > IH + 10) {
            d.y = -10;
            d.x = Math.random() * (IW + 40) - 20;
          }
        });
        if (weather === 'storm' && Math.random() < 0.008) {
          lightningFlash = 1;
          screenShake = Math.max(screenShake, 0.35);
          AudioSys.thunder();
          try { if (navigator.vibrate) navigator.vibrate([30, 40, 20]); } catch (e) {}
        }
      }

      if (state === 'casting') {
        castProgress += dt / 900;
        if (castProgress >= 1) { castProgress = 1; beginWaiting(); }
      }
      if (state === 'waiting') {
        waitElapsed += dt;
        bobberPhase += dt * 0.007;
        if (waitElapsed > waitTime - nearWindow) {
          nearFish = true;
          if (Math.random() < 0.1) {
            bubbles.push({ x: 240+Math.random()*20, y: 175+Math.random()*10, s: 2+Math.random()*2, life: 0, vy: -0.3-Math.random()*0.25 });
          }
          if (Math.random() < 0.02) AudioSys.waterLap();
        }
        bubbles.forEach(b => { b.y += b.vy; b.life += dt*0.0015; });
        bubbles = bubbles.filter(b => b.life < 1);
        if (waitElapsed >= waitTime) startPull();
      }
      if (state === 'pulling') {
        // huge fish fight lasts a bit longer + ongoing shake
        const slow = pullStruggle > 0 ? 1600 : 1100;
        pullProgress += dt / slow;
        if (pullStruggle > 0) {
          screenShake = 0.55 + 0.45 * Math.sin(now * 0.02);
          if (Math.random() < 0.04) AudioSys.reel();
          if (Math.random() < 0.025) {
            try { if (navigator.vibrate) navigator.vibrate(25); } catch (e) {}
          }
        } else if (screenShake > 0) {
          screenShake *= 0.9;
        }
        if (pullProgress >= 1) { pullProgress = 1; screenShake = 0.8; finishPull(); }
      } else if (screenShake > 0) {
        screenShake *= 0.85;
        if (screenShake < 0.02) screenShake = 0;
      }
      draw(now);
      requestAnimationFrame(loop);
    }
  </script>
